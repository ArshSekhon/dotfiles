# Shared tmux baseline; exact conversation records remain private.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -s escape-time 10
set -s extended-keys on
set -g focus-events on
set -g mouse on
set -g default-terminal tmux-256color

# OSC 52 can reach the SSH client's clipboard when its terminal supports it.
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep task names stable and create windows/panes in the current directory.
setw -g automatic-rename off
setw -g allow-rename off
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Tab last-window
bind s choose-tree -Zs
bind w choose-tree -Zw
bind R source-file ~/.tmux.conf \; display-message "tmux reloaded"

# One launcher: j/k choose scratch, pane, or session; h/l switch agent.
unbind -q a
unbind -q g
unbind -q C-x
unbind -q C-u
bind N run-shell -C "display-popup -EE -w 64 -h 13 -T 'Workspace' -e DOTFILES_TMUX_CLIENT=#{q:client_name} -e DOTFILES_TMUX_SOCKET=#{q:socket_path} -e DOTFILES_TMUX_PANE=#{pane_id} 'exec \"\$HOME/.local/bin/tmux-workspace\" --menu'"
bind b switch-client -l

# Start reviews on demand. Retain failed popups so their error remains visible.
bind r if-shell 'command -v tuicr >/dev/null 2>&1' \
    'display-popup -EE -w 95% -h 90% -d "#{pane_current_path}" -T "Local review" "tuicr -w"' \
    'display-message "Install tuicr to review local changes"'

# Tokyo Night palette; native formats keep status redraws free of subprocesses.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left-length 48
set -g status-right-length 24
set -g status-left ' #[fg=#{?client_prefix,#1a1b26,#7aa2f7},bg=#{?client_prefix,#e0af68,#1a1b26},#{?client_prefix,bold,nobold}]#{?#{e|<:#{client_width},80}, #{=/18/...:session_name} , #{=/12/...:host_short} #[default]#[fg=#565f89]| #[fg=#c0caf5]#{=/24/...:session_name} }#[default]'
set -g status-right '#{?window_zoomed_flag,#[fg=#bb9af7]ZOOM ,}#{?#{e|>=:#{client_width},100},#[fg=#565f89]%H:%M ,}'
setw -g window-status-separator ' '
setw -g window-status-format ' #I:#{=/24/...:window_name} '
setw -g window-status-current-format ' #I:#{=/24/...:window_name} '
setw -g window-status-style 'fg=#565f89,bg=#1a1b26'
setw -g window-status-current-style 'fg=#c0caf5,bg=#283457,bold'
set -g pane-border-style 'fg=#565f89'
set -g pane-active-border-style 'fg=#7aa2f7'
# Named-pane launches enable captions in their own window; formats stay native.
setw -g pane-border-format ' #{pane_index}: #{?@dotfiles_pane_name,#{=/24/...:@dotfiles_pane_name}#{?@dotfiles_agent, (#{@dotfiles_agent}),},#{?@dotfiles_agent,#{@dotfiles_agent},#{pane_current_command}}} '
set -g message-style 'fg=#e0af68,bg=#1a1b26'
setw -g mode-style 'fg=#c0caf5,bg=#283457'
set -g popup-style 'fg=#c0caf5,bg=#1a1b26'
set -g popup-border-style 'fg=#7aa2f7'

# Layouts stay with tmux-resurrect; saved managed commands resume exact IDs.
# No agent process is restored by a bare codex/claude command.
set -g @resurrect-never-overwrite on
set -g @resurrect-processes '~tmux-agent'
set -g @resurrect-hook-post-save-layout 'python3 "$HOME/.local/bin/tmux-agent" save-layout'

# Private machine overrides live beside the installed configuration, outside Git.
source-file -qF '#{d:current_file}/.tmux.local.conf'
