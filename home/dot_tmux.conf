# Shared tmux baseline; exact conversation records remain private.
set -g prefix C-a
unbind C-b

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -s escape-time 10
set -s extended-keys on
set -g focus-events on
set -g mouse on
set -g default-terminal tmux-256color

# OSC 52 can reach the SSH client's clipboard when its terminal supports it.
set -s set-clipboard on
setw -g mode-keys vi

# Keep task names stable and create windows/panes in the current directory.
setw -g automatic-rename off
setw -g allow-rename off

# Retired ambiguous launch shortcuts.
unbind -q C-x
unbind -q C-u

# BEGIN GENERATED KEYS
bind C-a send-prefix
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r S-Left if-shell -F "#{window_zoomed_flag}" "resize-pane -Z" \; run-shell -C 'if-shell -F "#{pane_at_left}" "" "swap-pane -d -s #{pane_id} -t \"{left-of}\""'
bind -r S-Down if-shell -F "#{window_zoomed_flag}" "resize-pane -Z" \; run-shell -C 'if-shell -F "#{pane_at_bottom}" "" "swap-pane -d -s #{pane_id} -t \"{down-of}\""'
bind -r S-Up if-shell -F "#{window_zoomed_flag}" "resize-pane -Z" \; run-shell -C 'if-shell -F "#{pane_at_top}" "" "swap-pane -d -s #{pane_id} -t \"{up-of}\""'
bind -r S-Right if-shell -F "#{window_zoomed_flag}" "resize-pane -Z" \; run-shell -C 'if-shell -F "#{pane_at_right}" "" "swap-pane -d -s #{pane_id} -t \"{right-of}\""'
bind p last-pane -Z
bind Tab last-window
bind s run-shell -C "display-popup -EE -w 80% -h 75% -T 'Sessions' -e DOTFILES_TMUX_CLIENT=#{q:client_name} -e DOTFILES_TMUX_SOCKET=#{q:socket_path} 'exec \"\$HOME/.local/bin/tmux-sessions\"'"
bind w choose-tree -Zw
bind R source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind ? display-popup -EE -w 85% -h 85% -T 'Keys' 'exec env LESS= LESSOPEN= LESSCLOSE= LESSHISTFILE=- LESSSECURE=1 less -i -P"j/k scroll  / search  q close" "$HOME/.config/tmux/cheatsheet.txt"'
bind N run-shell -C "display-popup -EE -w 64 -h 13 -T 'Workspace' -e DOTFILES_TMUX_CLIENT=#{q:client_name} -e DOTFILES_TMUX_SOCKET=#{q:socket_path} -e DOTFILES_TMUX_PANE=#{pane_id} 'exec \"\$HOME/.local/bin/tmux-workspace\" --menu'"
bind b switch-client -l
bind g run-shell -C "display-popup -EE -w 90% -h 80% -T 'Tasks' -e DOTFILES_TMUX_CLIENT=#{q:client_name} -e DOTFILES_TMUX_SOCKET=#{q:socket_path} 'exec \"\$HOME/.local/bin/tmux-tasks\"'"
bind a run-shell 'DOTFILES_TMUX_CLIENT=#{q:client_name} DOTFILES_TMUX_SOCKET=#{q:socket_path} exec "$HOME/.local/bin/tmux-tasks" --next-attention'
bind A run-shell -C "display-popup -EE -w 90% -h 80% -T 'Attention' -e DOTFILES_TMUX_CLIENT=#{q:client_name} -e DOTFILES_TMUX_SOCKET=#{q:socket_path} 'exec \"\$HOME/.local/bin/tmux-tasks\" --attention'"
bind B run-shell 'DOTFILES_TMUX_CLIENT=#{q:client_name} DOTFILES_TMUX_SOCKET=#{q:socket_path} exec "$HOME/.local/bin/tmux-tasks" --previous'
bind r run-shell -C "display-popup -EE -w 95% -h 90% -T 'Local review' -e DOTFILES_TMUX_CLIENT=#{q:client_name} -e DOTFILES_TMUX_SOCKET=#{q:socket_path} -e DOTFILES_TMUX_PANE=#{pane_id} 'exec \"\$HOME/.local/bin/tmux-review\"'"
bind z resize-pane -Z
bind [ copy-mode
# END GENERATED KEYS

# Tokyo Night palette; native formats keep status redraws free of subprocesses.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left-length 48
set -g status-right-length 64
set -g status-left ' #[fg=#{?client_prefix,#1a1b26,#7aa2f7},bg=#{?client_prefix,#e0af68,#1a1b26},#{?client_prefix,bold,nobold}]#{?#{e|<:#{client_width},80}, #{=/18/...:session_name} , #{=/12/...:host_short} #[default]#[fg=#565f89]| #[fg=#c0caf5]#{=/24/...:session_name} }#[default]'
set -g status-right '#{?#{e|>=:#{client_width},100},#{E:@dotfiles_attention_summary},#{E:@dotfiles_attention_compact}} #{?window_zoomed_flag,#[fg=#bb9af7]ZOOM ,}#{?#{e|>=:#{client_width},100},#[fg=#565f89]%H:%M ,}'
setw -g window-status-separator ' '
setw -g window-status-format ' #{E:@dotfiles_attention_mark}#I:#{=/24/...:window_name} '
setw -g window-status-current-format ' #{E:@dotfiles_attention_mark}#I:#{=/24/...:window_name} '
setw -g window-status-style 'fg=#565f89,bg=#1a1b26'
setw -g window-status-current-style 'fg=#c0caf5,bg=#283457,bold'
set -g pane-border-style 'fg=#565f89'
set -g pane-active-border-style 'fg=#7aa2f7'
# Named-pane launches enable captions in their own window; formats stay native.
setw -g pane-border-format ' #{pane_index}: #{?@dotfiles_pane_name,#{=/24/...:@dotfiles_pane_name}#{?@dotfiles_agent, (#{@dotfiles_agent}),},#{?@dotfiles_agent,#{@dotfiles_agent},#{pane_current_command}}}#{?@dotfiles_attention_caption, · #{@dotfiles_attention_caption},} '
set -g message-style 'fg=#e0af68,bg=#1a1b26'
setw -g mode-style 'fg=#c0caf5,bg=#283457'
set -g popup-style 'fg=#c0caf5,bg=#1a1b26'
set -g popup-border-style 'fg=#7aa2f7'

# Layouts stay with tmux-resurrect; saved managed commands resume exact IDs.
# No agent process is restored by a bare codex/claude command.
set -g @resurrect-never-overwrite on
set -g @resurrect-processes '~tmux-agent'
set -g @resurrect-hook-post-save-layout 'python3 "$HOME/.local/bin/tmux-agent" save-layout'

# Reconcile closed/respawned panes on native lifecycle events, never at idle.
# A separate array slot preserves plugin/user hooks. Unknown state stays unknown
# until a managed invocation reports a verified native event.
set-hook -g pane-exited[1701] 'run-shell -b "if [ -f \"$HOME/.local/bin/tmux-attention\" ]; then DOTFILES_TMUX_SOCKET=#{q:socket_path} python3 \"$HOME/.local/bin/tmux-attention\" refresh; fi"'
set-hook -g pane-died[1701] 'run-shell -b "if [ -f \"$HOME/.local/bin/tmux-attention\" ]; then DOTFILES_TMUX_SOCKET=#{q:socket_path} python3 \"$HOME/.local/bin/tmux-attention\" refresh; fi"'
set-hook -g window-unlinked[1701] 'run-shell -b "if [ -f \"$HOME/.local/bin/tmux-attention\" ]; then DOTFILES_TMUX_SOCKET=#{q:socket_path} python3 \"$HOME/.local/bin/tmux-attention\" refresh; fi"'
set-hook -g after-kill-pane[1701] 'run-shell -b "if [ -f \"$HOME/.local/bin/tmux-attention\" ]; then DOTFILES_TMUX_SOCKET=#{q:socket_path} python3 \"$HOME/.local/bin/tmux-attention\" refresh; fi"'

# Private machine overrides live beside the installed configuration, outside Git.
source-file -qF '#{d:current_file}/.tmux.local.conf'
